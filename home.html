<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Data Management</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="dashboard-header">
        <div>
            <h1>Data Management Dashboard</h1>
            <p>Welcome, <strong id="user-name"></strong> (<span id="user-email"></span>)</p>
        </div>
        <button id="logout-btn" class="btn btn-secondary">Logout</button>
    </header>

    <main class="dashboard-main">
        <section class="card form-card">
            <h2 id="form-title">Add New Record</h2>
            <input type="text" id="record-title" placeholder="Title">
            <input type="text" id="record-category" placeholder="Category (e.g. Finance, Personal)">
            <textarea id="record-description" placeholder="Description" rows="3"></textarea>
            <div class="form-actions">
                <button id="save-btn" class="btn btn-primary">Add Record</button>
                <button id="cancel-edit-btn" class="btn btn-secondary" hidden>Cancel</button>
            </div>
        </section>

        <section class="card table-card">
            <h2>Your Records</h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Category</th>
                            <th>Description</th>
                            <th>Created</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="records-body"></tbody>
                </table>
            </div>
            <p id="empty-state" class="empty-state" hidden>No records yet. Add your first record above.</p>
        </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
