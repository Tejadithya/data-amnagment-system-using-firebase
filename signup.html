<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>Sign Up</h2>
        <div id="signup-message" class="message" hidden></div>
        <input type="text" id="signup-name" placeholder="Username" autocomplete="username">
        <input type="email" id="signup-email" placeholder="Email" autocomplete="email">
        <input type="tel" id="signup-phone" placeholder="Phone">
        <input type="password" id="signup-password" placeholder="Password" autocomplete="new-password">
        <input type="password" id="signup-confirm-password" placeholder="Confirm Password" autocomplete="new-password">
        <button id="signup-btn">Sign Up</button>
        <p class="form-footer">Already have an account? <a href="login.html">Login</a></p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
